<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZTN Studio Monitor</title>
  <meta name="description" content="Weekly studio overview for the studio monitor.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="monitor">
  <header class="mon-head">
    <div>
      <h1>ZTN WEEKLY STUDIO OVERVIEW</h1>
      <div class="week-label" id="weekLabel"></div>
      <div class="legend"><span><i class="st-studio-1"></i>Studio 1</span><span><i class="st-studio-2"></i>Studio 2</span><span><i class="st-audio-studio"></i>Audio Studio</span><span><i class="st-mcr"></i>MCR</span><span><i class="st-other"></i>Other</span><span><i class="l-clash"></i>Same studio used twice</span></div>
    </div>
    <div class="now-next" id="nowNext"></div>
    <div class="clock-box">
      <div class="clock" id="clock"></div>
      <div class="status-dot" id="status"></div>
    </div>
  </header>
  <div id="setup"></div>
  <div class="mon-grid" id="grid"></div>
  <div class="fs-hint" id="fsHint" hidden>Press <b>OK</b> on the remote (or click) for full screen</div>

  <script>
    // Full screen on any button press, click or tap. Browsers only allow full
    // screen after a user action, so the first press switches it on. Covers the
    // standard API plus the older WebKit / Microsoft versions used by TV browsers.
    (function () {
      var el = document.documentElement;
      var request = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen
        || el.mozRequestFullScreen || el.msRequestFullscreen;
      var hint = document.getElementById('fsHint');
      if (!request) return;
      function isFull() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement
          || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      }
      function update() { hint.hidden = isFull(); }
      function goFull() {
        if (isFull()) return;
        try {
          var p = request.call(el);
          if (p && p.catch) p.catch(function () {});
        } catch (e) { /* not allowed here: the hint stays up */ }
      }
      ['keydown', 'click', 'touchend'].forEach(function (t) { document.addEventListener(t, goFull); });
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
        .forEach(function (t) { document.addEventListener(t, update); });
      update();

      // Hide the mouse pointer when it hasn't moved for a few seconds.
      var idle;
      document.addEventListener('mousemove', function () {
        document.body.classList.remove('no-cursor');
        clearTimeout(idle);
        idle = setTimeout(function () { document.body.classList.add('no-cursor'); }, 3000);
      });
    })();
  </script>

  <script type="module">
    import { db, isConfigured, showNotConfigured, mondayOf, fmtDate, nowParts, toMin, hm, esc, weekGridHTML, errMsg, syncClock } from './assets/app.js';

    // URL options: ?key=MONITOR_KEY  ?week=YYYY-MM-DD (any day in the week)  ?refresh=60 (seconds)
    const params = new URLSearchParams(location.search);
    const key = params.get('key') || null;
    const fixedWeek = params.get('week');
    const refreshSec = Math.max(15, Number(params.get('refresh')) || 60);
    const $ = (id) => document.getElementById(id);
    let rows = [];
    let weekStart = null;
    let lastOk = null;

    function tick() {
      const now = nowParts();
      $('clock').textContent = now.time.slice(0, 5);
      renderFoot(now);
    }

    let lastNowNext = '';

    // Countdown colour: green over 20 min, amber 20-10, solid red 10-5, then
    // flashing red for the last 5 minutes, flashing faster as the start nears.
    function updateCountdown(now, next) {
      const el = $('countdown');
      if (!el) return;
      const [h, m, s] = now.time.split(':').map(Number);
      const left = Math.max(0, toMin(next.start_time) * 60 - (h * 3600 + m * 60 + s));
      const pad = (n) => String(n).padStart(2, '0');
      const hh = Math.floor(left / 3600), mi = Math.floor((left % 3600) / 60), ss = left % 60;
      el.textContent = `Starts in ${hh ? `${hh}:${pad(mi)}:${pad(ss)}` : `${pad(mi)}:${pad(ss)}`}`;
      const level = left > 1200 ? 'cd-green' : left > 600 ? 'cd-amber' : left > 300 ? 'cd-red' : 'cd-flash';
      if (!el.classList.contains(level)) el.className = `countdown ${level}`;
      // 1.2 s per flash at 5:00 left, speeding up to 0.2 s at 0:00.
      el.style.animationDuration = level === 'cd-flash' ? `${(0.2 + (left / 300)).toFixed(2)}s` : '';
    }

    function renderFoot(now) {
      const today = rows.filter((b) => b.booking_date === now.date && (b.kind === 'show' || b.status === 'Confirmed'));
      const live = today.filter((b) => toMin(b.start_time) <= now.minutes && now.minutes < toMin(b.end_time));
      const next = today.filter((b) => toMin(b.start_time) > now.minutes).sort((a, b) => a.start_time.localeCompare(b.start_time))[0];
      // Two-column panel: label | text. The countdown sits in the text column under NEXT.
      const parts = live.map((b) => `<span class="tag live">ON NOW</span><span class="nn-text">${esc(b.studio)} · ${esc(b.title)} (until ${hm(b.end_time)})</span>`);
      if (next) {
        parts.push(`<span class="tag next">NEXT</span><span class="nn-text">${hm(next.start_time)} ${esc(next.studio)} · ${esc(next.title)}</span>`);
        parts.push('<span></span><span class="countdown" id="countdown"></span>');
      }
      if (!parts.length) parts.push('<span class="nn-none">Nothing more in the studios today.</span>');
      // Rebuild only when the lines change, so the countdown's flashing isn't restarted every second.
      const html = parts.join('');
      if (html !== lastNowNext) { $('nowNext').innerHTML = html; lastNowNext = html; }
      if (next) updateCountdown(now, next);
      const stale = lastOk && Date.now() - lastOk > refreshSec * 3000;
      $('status').textContent = stale ? '⚠ connection lost — showing last data'
        : `updated ${new Date(lastOk || Date.now()).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
      $('status').classList.toggle('stale', !!stale);
    }

    // Pick the largest text size at which the whole week (06:00 to 22:00) fits on screen.
    function fitGrid() {
      const grid = $('grid'), table = grid.querySelector('table');
      if (!table) return;
      const cs = getComputedStyle(grid);
      const avail = grid.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      let size = Math.max(8, Math.min(innerWidth * 0.0085, innerHeight * 0.016));
      for (; size > 6; size -= 0.5) {
        grid.style.setProperty('--mon-font', `${size}px`);
        if (table.offsetHeight <= avail + 1) break;
      }
    }

    async function refresh() {
      const now = nowParts();
      weekStart = mondayOf(fixedWeek || now.date);
      $('weekLabel').textContent = `Week commencing ${fmtDate(weekStart, { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })}`;
      const { data, error } = await db.rpc('week_overview', { p_start: weekStart, p_key: key });
      if (error) {
        if (/monitor key/i.test(errMsg(error))) {
          $('grid').innerHTML = '<div class="notice bad">This screen needs the monitor key: add <code>?key=…</code> to the address.</div>';
          return;
        }
        renderFoot(now);
        return; // keep showing the last good grid
      }
      rows = data;
      lastOk = Date.now();
      $('grid').innerHTML = weekGridHTML(rows, weekStart, { now: fixedWeek ? null : now });
      fitGrid();
      renderFoot(now);
    }

    if (!isConfigured) {
      showNotConfigured($('setup'));
    } else {
      syncClock().then(refresh);
      setInterval(syncClock, 3600 * 1000);
      setInterval(refresh, refreshSec * 1000);
      // Instant sync: the database broadcasts "changed" on every booking or show
      // edit; reload the week a moment later. The interval above is the backup.
      let syncTimer;
      db.channel('ztn-schedule')
        .on('broadcast', { event: 'changed' }, () => { clearTimeout(syncTimer); syncTimer = setTimeout(refresh, 500); })
        .subscribe();
      setInterval(tick, 1000);
      tick();
      // Reload every 6 hours so the screen picks up site updates.
      setTimeout(() => location.reload(), 6 * 3600 * 1000);
      let rt;
      addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitGrid, 150); });
      // The header can grow after the grid is drawn, leaving less room for it.
      if (window.ResizeObserver) new ResizeObserver(() => fitGrid()).observe($('grid'));
    }
  </script>
</body>
</html>
